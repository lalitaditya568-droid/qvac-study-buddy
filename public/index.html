<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>QVAC Study Buddy</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;

      font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      background:
        radial-gradient(
          circle at top left,
          #243b53 0%,
          #102a43 35%,
          #07111f 100%
        );

      color: #f8fafc;

      display: flex;
      justify-content: center;
      align-items: center;

      padding: 24px;
    }

    .app {
      width: 100%;
      max-width: 850px;

      background: rgba(15, 23, 42, 0.88);

      border: 1px solid rgba(255, 255, 255, 0.1);

      border-radius: 24px;

      padding: 36px;

      box-shadow:
        0 25px 80px rgba(0, 0, 0, 0.4);

      backdrop-filter: blur(15px);
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;

      gap: 20px;

      margin-bottom: 30px;
    }

    .title {
      margin: 0;

      font-size: 38px;
      line-height: 1.1;

      letter-spacing: -1px;
    }

    .subtitle {
      margin-top: 10px;

      color: #94a3b8;

      font-size: 16px;

      line-height: 1.5;
    }

    .badge {
      white-space: nowrap;

      padding: 8px 12px;

      border-radius: 999px;

      background: rgba(34, 197, 94, 0.12);

      color: #86efac;

      border: 1px solid rgba(34, 197, 94, 0.25);

      font-size: 13px;

      font-weight: 600;
    }

    label {
      display: block;

      margin-bottom: 10px;

      font-weight: 600;

      color: #e2e8f0;
    }

    textarea {
      width: 100%;

      min-height: 140px;

      resize: vertical;

      padding: 16px;

      border-radius: 14px;

      border: 1px solid #334155;

      background: #0f172a;

      color: #f8fafc;

      font-size: 16px;

      line-height: 1.5;

      outline: none;
    }

    textarea:focus {
      border-color: #60a5fa;

      box-shadow:
        0 0 0 3px rgba(96, 165, 250, 0.12);
    }

    button {
      margin-top: 14px;

      width: 100%;

      border: none;

      border-radius: 14px;

      padding: 15px;

      background: #3b82f6;

      color: white;

      font-size: 16px;

      font-weight: 700;

      cursor: pointer;

      transition:
        transform 0.15s ease,
        background 0.15s ease;
    }

    button:hover {
      background: #2563eb;

      transform: translateY(-1px);
    }

    button:disabled {
      opacity: 0.6;

      cursor: wait;

      transform: none;
    }

    .status {
      min-height: 24px;

      margin-top: 14px;

      color: #94a3b8;

      font-size: 14px;
    }

    .answer-container {
      margin-top: 26px;
    }

    .answer-title {
      font-size: 14px;

      font-weight: 700;

      text-transform: uppercase;

      letter-spacing: 0.08em;

      color: #94a3b8;

      margin-bottom: 10px;
    }

    .answer {
      min-height: 150px;

      padding: 20px;

      border-radius: 16px;

      background: #020617;

      border: 1px solid #1e293b;

      color: #e2e8f0;

      line-height: 1.7;

      white-space: pre-wrap;
    }

    .footer {
      margin-top: 22px;

      text-align: center;

      color: #64748b;

      font-size: 13px;
    }

    .footer strong {
      color: #94a3b8;
    }

    @media (max-width: 650px) {
      .app {
        padding: 24px;
      }

      .header {
        flex-direction: column;
      }

      .title {
        font-size: 30px;
      }
    }
  </style>
</head>

<body>

  <main class="app">

    <header class="header">

      <div>
        <h1 class="title">
          QVAC Study Buddy
        </h1>

        <p class="subtitle">
          A private AI study assistant running
          entirely on your computer.
        </p>
      </div>

      <div class="badge">
        ● ON-DEVICE AI
      </div>

    </header>

    <section>

      <label for="question">
        Ask a question
      </label>

      <textarea
        id="question"
        placeholder="Example: Explain the difference between supervised and unsupervised learning."
      ></textarea>

      <button id="askButton">
        Ask QVAC
      </button>

      <div
        class="status"
        id="status"
      ></div>

    </section>

    <section class="answer-container">

      <div class="answer-title">
        AI Answer
      </div>

      <div
        class="answer"
        id="answer"
      >
        Your answer will appear here.
      </div>

    </section>

    <div class="footer">
      Powered by <strong>QVAC</strong> —
      AI inference happens locally on this device.
    </div>

  </main>

  <script>
    const questionInput =
      document.getElementById("question");

    const askButton =
      document.getElementById("askButton");

    const status =
      document.getElementById("status");

    const answer =
      document.getElementById("answer");

    async function askQuestion() {
      const question =
        questionInput.value.trim();

      if (!question) {
        status.textContent =
          "Please enter a question.";

        return;
      }

      askButton.disabled = true;

      answer.textContent = "";

      status.textContent =
        "Loading the local QVAC model and generating an answer...";

      try {
        const response =
          await fetch("/api/ask", {
            method: "POST",

            headers: {
              "Content-Type":
                "application/json",
            },

            body: JSON.stringify({
              question,
            }),
          });

        const data =
          await response.json();

        if (!response.ok) {
          throw new Error(
            data.error ||
            "Something went wrong."
          );
        }

        answer.textContent =
          data.answer;

        status.textContent =
          "✓ Answer generated locally with QVAC.";
      } catch (error) {
        console.error(error);

        answer.textContent =
          "Error: " + error.message;

        status.textContent =
          "The request failed.";
      } finally {
        askButton.disabled = false;
      }
    }

    askButton.addEventListener(
      "click",
      askQuestion
    );

    questionInput.addEventListener(
      "keydown",
      (event) => {
        if (
          event.key === "Enter" &&
          (event.ctrlKey || event.metaKey)
        ) {
          askQuestion();
        }
      }
    );
  </script>

</body>
</html>
